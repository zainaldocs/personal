<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <!-- Subtle Glow for Premium Aesthetic -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Smooth Rounded Background (Squircle feel) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Modern Tech Z Logo -->
  <g filter="url(#glow)">
    <!-- Diagonal Bar -->
    <rect x="231" y="116" width="50" height="280" rx="25" transform="rotate(-38 256 256)" fill="url(#logoGrad)" />
    <!-- Top Horizontal Bar -->
    <rect x="140" y="140" width="200" height="50" rx="25" fill="url(#logoGrad)" />
    <!-- Bottom Horizontal Bar -->
    <rect x="172" y="322" width="200" height="50" rx="25" fill="url(#logoGrad)" />
  </g>
</svg>